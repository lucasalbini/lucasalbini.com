services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "1337:1337"
    volumes:
      - ./strapi:/opt/app
      - /opt/app/node_modules
      - strapi_uploads:/opt/app/public/uploads
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      HOST: ${STRAPI_HOST}
      PORT: ${STRAPI_PORT}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      # Signs the revalidation webhook the bootstrap creates (strapi/src/index.ts).
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET:-}
      NODE_ENV: development
      IMPORT_LEGACY: ${IMPORT_LEGACY:-0}

  fastapi:
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - strapi
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi/app:/app/app
    environment:
      STRAPI_BASE_URL: ${STRAPI_BASE_URL}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      FASTAPI_HOST: ${FASTAPI_HOST}
      FASTAPI_PORT: ${FASTAPI_PORT}
      CACHE_TTL: ${CACHE_TTL}
      NEXT_URL: ${NEXT_URL:-http://frontend:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET:-}
      CONTACT_MAX_PER_HOUR: ${CONTACT_MAX_PER_HOUR:-5}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - fastapi
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Server-side (Node in the frontend container) uses the internal hostname.
      API_URL: http://fastapi:8000
      # Client-side (browser) hits the same URLs via nginx.
      NEXT_PUBLIC_API_URL: http://localhost/api
      NEXT_PUBLIC_SITE_URL: http://localhost
      # Strapi uploads: browser resolves /uploads/* directly via nginx (served from volume).
      NEXT_PUBLIC_STRAPI_URL: http://localhost
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - fastapi
      - strapi
    volumes:
      - strapi_uploads:/var/www/uploads:ro

volumes:
  postgres_data:
  strapi_uploads:
