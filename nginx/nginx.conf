worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml text/javascript image/svg+xml
               application/atom+xml application/rss+xml;

    upstream frontend { server frontend:3000; }
    upstream fastapi  { server fastapi:8000;  }
    upstream strapi   { server strapi:1337;   }

    # /api/ (public read layer, hits FastAPI). Strapi's own /api is deliberately
    # NOT proxied — the CMS API stays internal to the compose network.
    map $request_uri $api_target {
        default frontend;
    }

    server {
        listen 80;
        server_name _;

        # Long-lived immutable assets from Next.
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Public read API (FastAPI).
        location /api/ {
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Media uploads served DIRECTLY from the shared volume — no Strapi hop.
        # We only serve GET/HEAD; anything else goes 405.
        location /uploads/ {
            alias /var/www/uploads/;
            access_log off;
            limit_except GET HEAD { deny all; }
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            try_files $uri =404;
        }

        # Strapi admin panel and the admin-only routes it calls internally.
        # We proxy exactly these paths; nothing else on Strapi is reachable
        # from outside the compose network.
        location = /admin { return 301 /admin/; }
        location /admin/ {
            proxy_pass http://strapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
        location ~ ^/(content-manager|content-type-builder|upload|users-permissions|i18n|content-releases|review-workflows)(/|$) {
            proxy_pass http://strapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Everything else -> Next. Vary tells caches (browser, CDN) that the
        # response depends on the language header and the locale cookie.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Vary "Accept-Language, Cookie" always;
        }
    }
}
