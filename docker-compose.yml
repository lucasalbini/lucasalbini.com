services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Loopback only. The VPS has no firewall (ufw inactive), so "8422:5432"
      # would publish the database to the whole internet.
      - "127.0.0.1:8422:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  strapi:
    # Images are built off-VPS and pulled. The VPS has 1 vCPU / 3.8 GB and runs
    # a live game server — building there risks the OOM killer picking it.
    image: ghcr.io/lucasalbini/lucasalbini-com-strapi:${IMAGE_TAG:-latest}
    build:
      context: ./strapi
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    # No host port. Externally, admin is reached at /admin via nginx.
    # Direct 1337 access is intentionally blocked from the public internet.
    expose:
      - "1337"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - strapi_uploads:/opt/app/public/uploads
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      HOST: ${STRAPI_HOST}
      PORT: ${STRAPI_PORT}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      # Signs the revalidation webhook the bootstrap creates (strapi/src/index.ts).
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET:-}
      NODE_ENV: production

  fastapi:
    image: ghcr.io/lucasalbini/lucasalbini-com-fastapi:${IMAGE_TAG:-latest}
    build:
      context: ./fastapi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - strapi
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      STRAPI_BASE_URL: ${STRAPI_BASE_URL}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      FASTAPI_HOST: ${FASTAPI_HOST}
      FASTAPI_PORT: ${FASTAPI_PORT}
      CACHE_TTL: ${CACHE_TTL}
      NEXT_URL: ${NEXT_URL:-http://frontend:3000}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}
      STRAPI_WEBHOOK_SECRET: ${STRAPI_WEBHOOK_SECRET:-}
      CONTACT_MAX_PER_HOUR: ${CONTACT_MAX_PER_HOUR:-5}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-pt-BR}

  frontend:
    image: ghcr.io/lucasalbini/lucasalbini-com-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        # Baked into the client bundle — must be the real public URL at build
        # time, not at run time. See frontend/Dockerfile.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      - fastapi
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
    environment:
      API_URL: http://fastapi:8000
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      # /api/revalidate refuses every call without it (FastAPI → Next after a webhook).
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-}

  nginx:
    image: ghcr.io/lucasalbini/lucasalbini-com-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    # No published port at all. Caddy owns 80/443 on this host (for the game) and
    # reaches this container by name over the shared `edge` network, so nothing
    # here is exposed to the internet directly.
    networks:
      default:
      edge:
        aliases:
          - lucasalbini-web
    depends_on:
      - frontend
      - fastapi
      - strapi
    volumes:
      - strapi_uploads:/var/www/uploads:ro

volumes:
  postgres_data:
  strapi_uploads:

networks:
  default:
  # The game stack's network, where Caddy lives. Declared external so this
  # compose never creates or removes it.
  edge:
    external: true
    name: infra_default
